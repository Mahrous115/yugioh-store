[pytest]
# --strict-markers turns an unregistered marker *in a test file* into a collection
# error rather than a warning, so @pytest.mark.integraton fails loudly instead of
# quietly marking nothing.
#
# It does NOT validate the -m expression on the command line: `-m "not integraton"`
# still matches every test and exits green. Nothing in pytest guards that, so keep
# the selection in one place (CI config or a Makefile target) rather than retyping
# it, and treat a sudden jump in the reported test count as the symptom.
addopts = --strict-markers

markers =
    integration: needs a live Supabase project, and usually the backend running at
        API_URL. Creates and deletes real users, listings and orders.
        Deselect with -m "not integration" for a run that needs neither.

# The integration side is marked, not the unit side, so CI runs -m "not integration".
# A new test file added without any marker is therefore *included* in that run: if
# it turns out to need a live backend it fails loudly and someone marks it. Marking
# the unit side instead would make the same omission silently shrink the CI subset,
# which is the failure you never notice.
